<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event attendees</title><style>body{font:15px Arial,sans-serif;max-width:1100px;margin:32px auto;padding:0 16px;color:#172033}form,section{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:10px}input,button{padding:9px;margin:4px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eff6ff;padding:12px;border-radius:8px}</style></head><body>
<p><a href="/dashboard">Dashboard</a></p><h1>Attendees</h1><p>Event #{{ event_id }}</p><section><h2>Live summary</h2><div class="stats" id="summary"></div></section>
<section><h2>Add guest</h2><form id="add-form"><input name="name" placeholder="Guest name" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone (optional)"><button>Add and invite</button></form></section>
<section><h2>Import CSV</h2><p>Columns: name,email; optional phone. Invalid rows are skipped and listed below.</p><form id="csv-form"><input name="file" type="file" accept=".csv,text/csv" required><button>Import guests</button></form><pre id="import-report"></pre></section>
<section><h2>Guest list</h2><table><thead><tr><th>Name</th><th>Email</th><th>RSVP</th><th>Attendance</th><th>Actions</th></tr></thead><tbody id="guest-rows"></tbody></table></section>
<script>
const eid={{ event_id|tojson }}, api=`/api/events/${eid}/attendees`;
async function refresh(){const [g,s]=await Promise.all([fetch(api).then(r=>r.json()),fetch(`${api}/summary`).then(r=>r.json())]);document.getElementById('guest-rows').replaceChildren();for(const x of g.attendees||[]){const tr=document.createElement('tr');for(const v of [x.name,x.email,x.rsvp_status,`${x.checked_in_at?'Checked in':'Not checked in'}${x.checked_out_at?' · Checked out':''}`]){const td=document.createElement('td');td.textContent=v;tr.append(td);}const td=document.createElement('td');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=async()=>{const name=prompt('Guest name',x.name);if(name===null)return;const email=prompt('Guest email',x.email);if(email===null)return;const phone=prompt('Guest phone',x.phone||'');if(phone===null)return;await fetch(`${api}/${x.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone})});refresh();};td.append(edit);const action=document.createElement('button');action.textContent=x.checked_in_at?'Check out':'Check in';action.onclick=async()=>{await fetch(`${api}/${x.id}/${x.checked_in_at?'check-out':'check-in'}`,{method:'POST'});refresh();};td.append(action);const del=document.createElement('button');del.textContent='Remove';del.onclick=async()=>{if(confirm(`Remove ${x.name}?`)){await fetch(`${api}/${x.id}`,{method:'DELETE'});refresh();}};td.append(del);tr.append(td);document.getElementById('guest-rows').append(tr);}const box=document.getElementById('summary');box.replaceChildren();for(const [k,v] of Object.entries(s.summary||{})){const d=document.createElement('span');d.className='stat';d.textContent=`${k.replaceAll('_',' ')}: ${v}`;box.append(d);}}
document.getElementById('add-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();if(!r.ok)alert(x.message);e.target.reset();refresh();};
document.getElementById('csv-form').onsubmit=async e=>{e.preventDefault();const r=await fetch(`${api}/import`,{method:'POST',body:new FormData(e.target)});const d=await r.json();document.getElementById('import-report').textContent=JSON.stringify(d.report||d,null,2);refresh();};refresh();setInterval(refresh,15000);
</script>{% include 'partials/notification_bell.html' %}</body></html>
