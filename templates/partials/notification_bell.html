{% if current_user_id %}
<aside id="era-notification-widget" style="position:fixed;right:20px;bottom:20px;z-index:5000;font:14px Arial,sans-serif">
  <button id="era-notification-toggle" type="button" aria-label="Notifications" style="border:0;border-radius:24px;padding:12px 16px;background:#172554;color:#fff;cursor:pointer">🔔 <span id="era-unread-count">0</span></button>
  <section id="era-notification-panel" hidden style="position:absolute;right:0;bottom:54px;width:min(360px,90vw);max-height:65vh;overflow:auto;background:white;color:#111827;border:1px solid #ddd;border-radius:10px;padding:12px">
    <header><strong>Notifications</strong> <button id="era-mark-all-read" type="button">Mark all read</button></header><div id="era-notification-list" aria-live="polite"></div>
  </section>
</aside>
<script>
(() => {const panel=document.getElementById('era-notification-panel'),list=document.getElementById('era-notification-list'),count=document.getElementById('era-unread-count');async function refresh(){try{const r=await fetch('/api/notifications?limit=30');if(!r.ok)return;const d=await r.json();count.textContent=d.unread_count;list.replaceChildren();if(!d.notifications.length){list.textContent='You are all caught up.';return;}for(const n of d.notifications){const row=document.createElement('div');row.style.cssText='padding:10px 2px;border-bottom:1px solid #eee';const msg=document.createElement(n.link?'a':'p');msg.textContent=n.message;msg.style.margin='0';if(n.link){msg.href=n.link;msg.style.color='#1d4ed8';}row.append(msg);if(n.status==='unread'){const b=document.createElement('button');b.textContent='Mark read';b.type='button';b.onclick=async()=>{await fetch(`/api/notifications/${n.id}/read`,{method:'POST'});refresh();};row.append(b);}list.append(row);}}catch(_){}}document.getElementById('era-notification-toggle').onclick=()=>{panel.hidden=!panel.hidden;refresh();};document.getElementById('era-mark-all-read').onclick=async()=>{await fetch('/api/notifications/read-all',{method:'POST'});refresh();};refresh();setInterval(refresh,60000);})();
</script>
{% endif %}
