<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event deliveries</title><style>body{font:15px Arial,sans-serif;max-width:900px;margin:32px auto;padding:0 16px}article{border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0}a{margin-right:16px}</style><script src="{{ url_for('static', filename='js/csrf.js') }}" defer></script></head><body><h1>Manage event deliveries</h1>{% for event in events %}<article><h2>{{ event.name }}</h2><p>{{ event.event_date }} · {{ event.status|title }}</p><a href="/events/{{ event.id }}/deliveries">View tracking and create tasks</a></article>{% else %}<p>No events are currently assigned to you.</p>{% endfor %}{% include 'partials/notification_bell.html' %}</body></html>
